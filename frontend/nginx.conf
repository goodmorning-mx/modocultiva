server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  types {
    text/html html;
    application/javascript js mjs;
    text/css css;
    application/manifest+json webmanifest;
    image/png png;
    image/svg+xml svg;
    image/jpeg jpg jpeg;
    image/webp webp;
    font/woff2 woff2;
  }

  location = / {
    default_type text/html;
    try_files /index.html =404;
  }

  location = /index.html {
    default_type text/html;
    try_files $uri =404;
  }

  location ~* \.m?js$ {
    default_type application/javascript;
    try_files $uri =404;
  }

  location ~* \.css$ {
    default_type text/css;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Content-Disposition "inline" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /sw.js {
    default_type application/javascript;
    add_header Content-Disposition "inline" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /downloads/modo-cultiva.apk {
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="modo-cultiva.apk"' always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
