<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b231f" />
    <meta name="application-name" content="Modo Cultiva" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Modo Cultiva" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/cultiva-electric-green-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/cultiva-electric-green-180.png" />
    <meta name="description" content="Tu mapa de vida y tus journeys de desarrollo humano." />
    <meta name="modo-cultiva-build" content="2026-10-02-i18n-specialists" />
    <link rel="manifest" href="/manifest.webmanifest?v=2026-11-23-clear-launch" />
    <link rel="preload" as="image" href="/brand/cultiva-electric-mark-v1.webp" />
    <title>Modo Cultiva</title>
    <style>
      #pwa-launch {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #0b231f;
        color: #b0efcb;
      }
      #pwa-launch-mark {
        display: block;
        width: min(clamp(104px, 33vw, 156px), 48vh);
        height: auto;
      }
      #pwa-launch-name {
        position: absolute;
        inset-inline: 12px;
        bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(24px, 5vh, 48px));
        margin: 0;
        text-align: center;
        font: 600 clamp(15px, 4vw, 18px)/1.25 system-ui, sans-serif;
        letter-spacing: .045em;
      }
    </style>
  </head>
  <body>
    <div id="pwa-launch" role="status">
      <img id="pwa-launch-mark" src="/brand/cultiva-electric-mark-v1.webp" width="384" height="384" alt="" />
      <p id="pwa-launch-name">Modo Cultiva</p>
    </div>
    <div id="root"></div>
    <script id="pwa-launch-clock">
      (() => {
        const installed = matchMedia('(display-mode: standalone)').matches ||
          navigator.standalone === true || /ModoCultivaAndroidApp/i.test(navigator.userAgent);
        if (!installed) return;

        // Run while the app code downloads. Count only visible time after the
        // mark has painted so a fast (or backgrounded) launch cannot flash by.
        const minVisibleMs = 1200;
        const mark = document.getElementById('pwa-launch-mark');
        window.modoCultivaLaunchReady = new Promise(resolve => {
          let remaining = minVisibleMs;
          let visibleSince = null;
          let timer = 0;
          let frame = 0;
          let imageDeadline = 0;

          function reconcile() {
            clearTimeout(timer);
            cancelAnimationFrame(frame);
            if (visibleSince !== null) {
              remaining -= performance.now() - visibleSince;
              visibleSince = null;
            }
            if (document.hidden) return;
            if (remaining <= 0) {
              document.removeEventListener('visibilitychange', reconcile);
              resolve();
              return;
            }
            // The second frame leaves a paint opportunity between the two.
            frame = requestAnimationFrame(() => {
              frame = requestAnimationFrame(() => {
                if (document.hidden) return;
                visibleSince = performance.now();
                timer = setTimeout(reconcile, remaining);
              });
            });
          }

          function start() {
            clearTimeout(imageDeadline);
            mark?.removeEventListener('load', start);
            mark?.removeEventListener('error', start);
            document.addEventListener('visibilitychange', reconcile);
            reconcile();
          }

          if (!mark || mark.complete) start();
          else {
            mark.addEventListener('load', start);
            mark.addEventListener('error', start);
            // Never trap the app behind a stalled image on a poor connection.
            imageDeadline = setTimeout(start, 800);
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
