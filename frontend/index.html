    <style>
      #pwa-launch {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #0b231f;
        color: #b0efcb;
      }
      #pwa-launch-mark {
        display: block;

        height: auto;
      }
      #pwa-launch-name {
        position: absolute;
        inset-inline: 12px;
        bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(24px, 5vh, 48px));
        margin: 0;
        text-align: center;
        font: 600 clamp(15px, 4vw, 18px)/1.25 system-ui, sans-serif;
        letter-spacing: .045em;
      }
    </style>

    <div id="pwa-launch" role="status">
      <img id="pwa-launch-mark" src="/brand/cultiva-electric-mark-v1.webp" width="384" height="384" alt="" />

    <script type="module" src="/src/main.tsx"></script>
