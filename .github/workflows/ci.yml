name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run verify:pwa
      - run: npm run verify:navigation
      - run: npm run verify:configurations
      - run: npm run verify:activities
      - run: npm run verify:level
      - run: npm run verify:social
      - run: npm run verify:ai
      - run: npm run verify:clarity
      - run: npm run verify:map
      - run: npm run verify:badges
      - run: npm run verify:welcome
      - run: npm run verify:state-sync
      - run: npm run verify:app-state
      - run: npm run verify:tutorial
      - run: npm run verify:activity-flow
      - run: npm run verify:community
      - run: npm run verify:audiences
      - run: npm run verify:onboarding
      - run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      migration-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: modocultiva_community_migration_test
          POSTGRES_USER: synthetic_migration_user
          POSTGRES_PASSWORD: synthetic_ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic_migration_user -d modocultiva_community_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - run: alembic history --verbose
      - run: python -m scripts.verify_community_migration
        env:
          COMMUNITY_MIGRATION_TEST_URL: postgresql+psycopg://synthetic_migration_user:synthetic_ci_only_password@127.0.0.1:5432/modocultiva_community_migration_test

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build
      - run: docker compose up --build --wait
      - run: curl --fail http://127.0.0.1:8000/health
      - run: curl --fail http://127.0.0.1:8080/
      - if: always()
        run: docker compose down --volumes
